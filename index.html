<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortly — URL shortener</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f3ed;color:#20251e;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}header{padding:30px 6vw;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#698b39}.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#777d70}main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 24px 80px}.content{width:min(100%,760px);text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:#e9eddf;padding:10px 16px;border-radius:30px}.dot{width:6px;height:6px;background:#6c8e40;border-radius:50%}h1{font-size:clamp(45px,8vw,76px);line-height:1.03;letter-spacing:-4px;margin:28px 0 20px;font-weight:800}h1 span{color:#6b843f}.subtitle{font-size:17px;line-height:1.6;color:#7a7e72;margin:0 0 42px}.panel{background:#fff;border:1px solid #e3e5da;border-radius:22px;padding:28px;box-shadow:0 18px 55px #293b1010;text-align:left}.label-row{display:flex;justify-content:space-between;margin-bottom:12px}label{font-size:12px;font-weight:700}.secure{font-size:11px;color:#8a907f}.input-track{height:62px;width:100%;display:flex;align-items:center}input{display:block;width:100%;min-width:0;height:58px;border:1px solid #dfe3d5;border-radius:11px;padding:0 18px;background:#fafbf7;color:#404936;font:14px Arial;outline:none;transition:width 4.5s cubic-bezier(.25,.1,.25,1),padding 4.5s ease;overflow:hidden}input:focus{border-color:#7d9957;box-shadow:0 0 0 3px #829b5620}input.shrunk{width:46px;padding-left:8px;padding-right:8px}.action{width:100%;margin-top:14px;padding:18px;border:0;border-radius:11px;background:#c6ed87;color:#263a13;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,transform .2s}.action:hover{background:#b7df77}.action:active{transform:scale(.99)}.action:disabled{cursor:wait}.status{height:24px;margin:16px 0 0;font-size:12px;color:#8b907f;text-align:center}.status.done{color:#506e2d;font-weight:700}.reset{display:block;margin:20px auto 0;background:none;border:0;border-bottom:1px solid #a4aa9a;padding:4px;color:#777e6c;cursor:pointer;font-size:12px;visibility:hidden}.reset.visible{visibility:visible}footer{text-align:center;padding:24px;font-size:10px;letter-spacing:1.5px;color:#979c8e;text-transform:uppercase}@media(max-width:500px){header{padding:25px}.tag{font-size:9px;letter-spacing:1px}main{padding:24px 20px 50px}h1{letter-spacing:-2.5px}.panel{padding:20px}.subtitle{font-size:15px}.secure{display:none}}
/* Keep the animated field the visual focus, including in phone recordings. */
.label-row{align-items:center;margin-bottom:18px}label{font-size:13px;letter-spacing:.2px}.secure{color:#64823c;background:#edf6df;padding:6px 10px;border-radius:20px}.input-track{height:92px;margin-bottom:10px}input{height:82px;border:3px solid #314627;border-radius:16px;padding:0 22px;background:linear-gradient(115deg,#f2ffd9,#e2f7b9);color:#22351a;font-size:19px;font-weight:600;letter-spacing:-.4px;box-shadow:0 6px 0 #314627,0 0 0 6px #c6ed8740,0 14px 28px #6f983b26;transition:width 4.5s cubic-bezier(.25,.1,.25,1),padding 4.5s ease,box-shadow .25s ease,border-color .25s ease}input::placeholder{color:#6a8153;font-weight:400;font-size:16px;letter-spacing:-.3px}input:hover{box-shadow:0 6px 0 #314627,0 0 0 8px #c6ed8760,0 14px 32px #6f983b32}input:focus{border-color:#314627;box-shadow:0 6px 0 #314627,0 0 0 8px #c6ed8780,0 14px 36px #6f983b38}input.shrunk{width:46px;padding-left:8px;padding-right:8px}.action{background:#273b20;color:#edffd9;margin-top:18px}.action:hover{background:#3b542f}.status{height:auto;min-height:24px;line-height:1.5}@media(max-width:500px){input{font-size:16px;padding:0 14px}input::placeholder{font-size:13px}.input-track{height:86px}input{height:76px}.label-row{margin-bottom:14px}}
/* The scissors and field share one moving edge, so every snip stays aligned. */
.input-track{position:relative;isolation:isolate}.input-track::before{content:"";position:absolute;left:12px;right:4px;top:50%;border-top:2px dashed #a1b588;z-index:-1;opacity:0;transition:opacity .2s}.input-track:has(.cutting)::before{opacity:1}.cut-field{position:relative;width:100%;min-width:0;transition:width 4.5s cubic-bezier(.25,.1,.25,1)}.cut-field.trimmed{width:46px}.cut-field input{width:100%;transition:padding 4.5s ease,box-shadow .25s,border-color .25s}.cut-field.trimmed input{padding-left:8px;padding-right:8px}.scissors{position:absolute;right:0;top:50%;width:80px;height:80px;transform:translate(50%,-50%) rotate(-12deg);filter:drop-shadow(0 5px 3px #263a1330);pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}.scissors svg{width:100%;height:100%;overflow:visible}.cutting .scissors{opacity:1}.blade{transform-origin:48px 51px}.cutting .blade-one{animation:snip-one .28s ease-in-out infinite alternate}.cutting .blade-two{animation:snip-two .28s ease-in-out infinite alternate}@keyframes snip-one{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}@keyframes snip-two{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}@media(max-width:500px){.scissors{width:64px;height:64px}}
/* Responsive viewport layout: keep the whole interaction in view. */
html{min-height:100%;-webkit-text-size-adjust:100%}body{min-height:100svh;min-height:100dvh}header{flex-shrink:0;padding:clamp(14px,3vh,26px) clamp(20px,5vw,70px);gap:16px}main{padding:12px 24px 20px;min-width:0}.content{width:min(100%,620px)}h1{font-size:clamp(38px,min(7.8vw,9vh),64px);letter-spacing:-2.8px;margin:20px 0 14px}.subtitle{font-size:15px;margin:0 0 24px}.panel{padding:24px}.label-row{margin-bottom:12px;gap:8px}.input-track{height:86px;margin-bottom:6px}.cut-field input{height:74px}.action{min-height:48px;padding:15px;margin-top:14px}.status{margin-top:12px;font-size:12px}.reset{min-height:44px;margin-top:8px;padding:12px}.scissors{width:64px;height:64px}footer{flex-shrink:0;padding:12px 20px;font-size:9px;line-height:1.4}
@media(max-width:600px){header{padding:16px 20px}.brand{font-size:24px}.tag{max-width:130px;text-align:right;font-size:8px;line-height:1.6;letter-spacing:1px}main{padding:8px 16px 8px}.content{max-width:440px}.eyebrow{font-size:9px;padding:8px 12px;letter-spacing:1.5px}h1{font-size:clamp(36px,10vw,52px);letter-spacing:-2px;margin:18px 0 12px}.subtitle{font-size:14px;max-width:280px;margin:0 auto 22px;line-height:1.5}.panel{padding:20px;border-radius:20px}label{font-size:12px}.secure{display:none}.input-track{height:82px}.cut-field input{height:70px;font-size:16px;padding-left:14px;padding-right:14px}input::placeholder{font-size:13px}.action{font-size:15px}.status{font-size:11px}.scissors{width:56px;height:56px}footer{font-size:8px;padding:10px 16px}}
@media(max-height:740px){header{padding-top:12px;padding-bottom:12px}main{padding-top:4px;padding-bottom:4px}h1{font-size:clamp(34px,min(10vw,8.5vh),54px);margin:12px 0 8px}.subtitle{margin-bottom:16px;font-size:14px}.eyebrow{padding:7px 12px}.panel{padding:18px 20px}.label-row{margin-bottom:8px}.input-track{height:74px}.cut-field input{height:64px}.action{margin-top:10px;padding:13px}.status{margin-top:10px}.reset{margin-top:2px}footer{padding:8px 16px}}
@media(max-height:540px){header{padding-top:8px;padding-bottom:8px}.eyebrow{display:none}h1{font-size:32px;margin:4px 0 6px}h1 br{display:none}h1 span{white-space:nowrap}.subtitle{margin-bottom:10px;font-size:12px}.panel{padding:12px 18px}.input-track{height:62px}.cut-field input{height:54px}.action{min-height:44px;padding:11px}.status{margin-top:8px}.reset{min-height:36px;padding:8px}footer{display:none}}
</style>
</head>
<body>
<header><div class="brand">shortly<span>↗</span></div><div class="tag">Small links. Big possibilities.</div></header>
<main><section class="content"><div class="eyebrow"><span class="dot"></span> A little less URL</div><h1>Long URL?<br>Make it <span>short.</span></h1><p class="subtitle">Paste your link. Click shorten. Watch the magic.</p><form class="panel" id="form" novalidate><div class="label-row"><label for="url">↘ Paste your long link here</label><span class="secure">No sign-up needed ↗</span></div><div class="input-track"><div class="cut-field" id="cut-field"><input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-really-really-long-link.com/something"required><span class="scissors" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><g class="blade blade-one"><path d="M48 50L19 6Q13 9 19 20L48 54" fill="#dce5ea" stroke="#334536" stroke-width="3"/><ellipse cx="67" cy="76" rx="12" ry="16" transform="rotate(-30 67 76)" stroke="#ff7849" stroke-width="8"/><path d="M48 50L61 65" stroke="#334536" stroke-width="5"/></g><g class="blade blade-two"><path d="M48 50L77 6Q83 9 77 20L48 54" fill="#f4f7f8" stroke="#334536" stroke-width="3"/><ellipse cx="29" cy="76" rx="12" ry="16" transform="rotate(30 29 76)" stroke="#ff7849" stroke-width="8"/><path d="M48 50L35 65" stroke="#334536" stroke-width="5"/></g><circle cx="48" cy="51" r="5" fill="#a8bbc5" stroke="#334536" stroke-width="2"/></svg></span></div></div><button class="action" id="shorten" type="submit">Shorten URL &nbsp; ↗</button><p class="status" id="status" role="status" aria-live="polite">Good things come in small input boxes.</p></form><button class="reset" id="reset" type="button">↻ &nbsp; Try another link</button></section></main>
<footer>Less is more. Literally.</footer>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#url'),button=document.querySelector('#shorten'),status=document.querySelector('#status'),reset=document.querySelector('#reset');
const cutField=document.querySelector('#cut-field');
let phase='ready',timer;
form.addEventListener('submit',event=>{event.preventDefault();if(phase!=='ready')return;if(!input.value.trim()){status.textContent='Paste a URL first.';input.focus();return;}let url;try{url=new URL(input.value.trim());if(!['http:','https:'].includes(url.protocol))throw Error();}catch{status.textContent='Enter a URL starting with https:// or http://';input.focus();return;}phase='shrinking';input.readOnly=true;button.disabled=true;button.textContent='Shortening…';status.textContent='Snip, snip… trimming your link ✂';cutField.classList.add('cutting','trimmed');timer=setTimeout(()=>{phase='done';cutField.classList.remove('cutting');button.textContent='Shortened ✓';status.textContent='Your input box is now 92% shorter. You’re welcome.';status.classList.add('done');reset.classList.add('visible');},4600);});
reset.addEventListener('click',()=>{clearTimeout(timer);phase='ready';cutField.classList.remove('cutting','trimmed');input.readOnly=false;button.disabled=false;button.innerHTML='Shorten URL &nbsp; ↗';status.textContent='Good things come in small input boxes.';status.classList.remove('done');reset.classList.remove('visible');input.focus();});
</script>
</body>
</html>
